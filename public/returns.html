<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lojiq WMS - Returns</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .topbar { position: absolute; top: 24px; left: 24px; z-index: 1000; }
    .home-button {
      display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 14px;
      text-decoration: none; font-weight: 700; font-size: 18px; letter-spacing: 0.3px; color: #DCEBFF;
      background: linear-gradient(135deg, #2F80ED, #66B3FF); border: 1px solid rgba(102, 179, 255, 0.35);
      box-shadow: 0 10px 24px rgba(47, 128, 237, 0.25); transition: all 0.2s ease;
    }
    .home-button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(47, 128, 237, 0.35); }
    .home-icon { width: 22px; height: 22px; }

    :root {
      --bg: #07111F;
      --panel: #0E2238;
      --border: #163252;
      --primary: #2F80ED;
      --primary-soft: #66B3FF;
      --text: #DCEBFF;
      --muted: #8FAECC;
      --success-bg: #DDF5E8;
      --success-border: #16B364;
      --success-text: #184B32;
      --error-bg: #FDE8E8;
      --error-border: #F04438;
      --error-text: #5F2120;
      --warn: #FBBF4C;
    }

    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(circle at top, rgba(47,128,237,0.18), transparent 30%), linear-gradient(180deg, #050D18 0%, var(--bg) 100%);
    }
    [hidden] { display: none !important; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 60px 20px 120px; text-align: center; }
    h1 { margin: 0 0 14px; font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { margin: 0 0 34px; color: var(--muted); font-size: 20px; }

    input, textarea, select {
      width: 100%; padding: 18px 20px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.92); color: #1f2937; font-size: 20px; outline: none;
    }
    textarea { min-height: 110px; resize: vertical; font-size: 18px; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(47,128,237,0.16); }
    .scan { max-width: 560px; margin: 0 auto; }

    .btn {
      padding: 16px 22px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
      color: var(--text); font-size: 17px; font-weight: 800; cursor: pointer;
    }
    .btn:hover { border-color: var(--primary); }
    .btn.primary { background: linear-gradient(135deg, #2F80ED, #66B3FF); border-color: transparent; color: #fff; }
    .btn.ok { background: #16B364; border-color: #16B364; color: #fff; }
    .btn.flaw { background: #F04438; border-color: #F04438; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

    .card {
      max-width: 760px; margin: 24px auto 0; padding: 20px; border-radius: 18px; text-align: left;
      background: linear-gradient(180deg, rgba(16,41,68,0.95), rgba(14,34,56,0.95)); border: 1px solid var(--border);
    }
    .card h2 { margin: 0 0 12px; font-size: 22px; }
    .muted { color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; padding: 12px;
      border-radius: 14px; border: 1px solid var(--border); background: rgba(7,17,31,0.6); cursor: pointer; text-align: left; color: var(--text); width: 100%;
    }
    .item:hover { border-color: var(--primary); }
    .item img, .item .noimg { width: 72px; height: 72px; object-fit: contain; background: #fff; border-radius: 10px; }
    .item .noimg { background: rgba(255,255,255,0.08); }
    .item strong { font-size: 18px; }
    .tag { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(102,179,255,0.16); color: var(--primary-soft); margin-left: 6px; }
    .tag.warn { background: rgba(251,191,76,0.16); color: var(--warn); }

    .message { max-width: 760px; margin: 20px auto 0; padding: 16px 18px; border-radius: 14px; text-align: left; font-size: 17px; }
    .message.success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }
    .message.error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
    .message ul { margin: 8px 0 0; padding-left: 20px; }
    .section-title { margin: 18px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    @media (max-width: 640px) {
      h1 { font-size: 38px; margin-top: 50px; }
      .grid2 { grid-template-columns: 1fr; }
      .item { grid-template-columns: 56px 1fr; }
      .item img, .item .noimg { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="home-button">
      <svg class="home-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Home
    </a>
  </div>

  <div class="wrap">
    <h1>Returns</h1>
    <p class="subtitle">Scan the box of a returned pair, or type its SKU</p>

    <form class="scan" id="scanForm" autocomplete="off">
      <input id="scanInput" placeholder="Scan barcode or type SKU…" autofocus>
    </form>
    <div class="row">
      <button class="btn" type="button" id="showAll">Show all expected returns</button>
    </div>

    <!-- Barcode not known: SKU and size by hand, and the barcode is learned. -->
    <div class="card" id="manualCard" hidden>
      <h2>Barcode not known</h2>
      <p class="muted" id="manualText" style="margin-top:0">Type the SKU and size from the box. The barcode is saved with them, so the next box of this pair just scans.</p>
      <form class="grid2" id="manualForm">
        <input id="manualSku" placeholder="SKU, e.g. DD1391-100">
        <input id="manualSize" placeholder="Size, e.g. 42">
        <button class="btn primary" type="submit" style="grid-column:1/-1">Find the return</button>
      </form>
    </div>

    <div class="card" id="pickCard" hidden>
      <h2 id="pickTitle">Which return is this?</h2>
      <input id="pickSearch" placeholder="Search order, item, seller…" hidden style="margin-bottom:12px">
      <div id="pickList"></div>
    </div>

    <div class="card" id="judgeCard" hidden>
      <h2 id="judgeTitle"></h2>
      <div id="judgeInfo" class="muted"></div>
      <div id="okThenBox" hidden style="margin-top:12px">
        <label class="muted" for="okThen">If it is OK, this seller's pair:</label>
        <select id="okThen">
          <option value="keep">Keep it, back on sale (seller is paid)</option>
          <option value="send_back">Send it back to the seller (he sends the label)</option>
        </select>
      </div>
      <div class="row">
        <button class="btn ok" type="button" id="okButton">✓ OK - in order</button>
        <button class="btn flaw" type="button" id="flawButton">✕ It has a flaw</button>
      </div>
      <div id="flawBox" hidden style="margin-top:16px">
        <div id="flawThenBox" hidden style="margin-bottom:8px">
          <label class="muted" for="flawThen">This pair with a flaw:</label>
          <select id="flawThen">
            <option value="send_back">Send it back to the seller (he sends the label)</option>
            <option value="troubled">Keep it - Troubled Stock (seller is paid)</option>
          </select>
        </div>
        <textarea id="flawNote" placeholder="What is wrong? (worn, damaged box, wrong size, fake…)"></textarea>
        <div class="row"><button class="btn flaw" type="button" id="flawSave">Save with flaw</button></div>
      </div>
      <div class="row"><button class="btn" type="button" id="back">Back</button></div>
    </div>

    <div id="message" class="message" hidden></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const day = (value) => (value ? new Date(value).toLocaleDateString("nl-NL") : "");
    const SOURCE = { store_order: "Store order", member_wtb: "Member WTB", woovin: "Woovin", bol: "bol", manual: "By hand" };

    // What was scanned, so a barcode typed in by hand can be learned.
    const state = { barcode: "", learn: false, sku: "", size: "", list: [], all: false, chosen: null };

    async function post(url, body) {
      const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) throw new Error(data.error || data.details || `The server answered ${response.status}.`);
      return data;
    }

    function show(id) {
      for (const card of ["manualCard", "pickCard", "judgeCard"]) $(card).hidden = card !== id;
    }

    function message(kind, html) {
      $("message").className = `message ${kind}`;
      $("message").innerHTML = html;
      $("message").hidden = !html;
    }

    function reset() {
      Object.assign(state, { barcode: "", learn: false, sku: "", size: "", list: [], all: false, chosen: null });
      show("");
      $("scanInput").value = "";
      $("scanInput").focus();
    }

    /* ---------------- scan ---------------- */

    $("scanForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = $("scanInput").value.trim();
      if (!value) return;
      message("", "");
      state.barcode = "";
      state.learn = false;

      if (/^\d{8,14}$/.test(value.replace(/\s+/g, ""))) {
        state.barcode = value.replace(/\s+/g, "");
        try {
          const found = await post("/api/lookup-product", { gtin: state.barcode });
          if (found.found) return find(found.sku, found.size);
          if (found.reason === "lookup_failed") message("error", "The barcode lookup did not answer. Scan again, or type the SKU.");
        } catch (err) {
          message("error", esc(err.message));
        }
        state.learn = true;
        $("manualSku").value = "";
        $("manualSize").value = "";
        show("manualCard");
        $("manualSku").focus();
        return;
      }

      // A SKU typed in: the size still has to come.
      $("manualText").textContent = "Type the size from the box.";
      $("manualSku").value = value.toUpperCase();
      $("manualSize").value = "";
      show("manualCard");
      $("manualSize").focus();
    });

    $("manualForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const sku = $("manualSku").value.trim().toUpperCase();
      const size = $("manualSize").value.trim();
      if (!sku || !size) return message("error", "Type both the SKU and the size.");
      find(sku, size);
    });

    async function find(sku, size) {
      state.sku = sku;
      state.size = size;
      try {
        const data = await post("/api/returns/match", { sku, size });
        state.list = [...data.exact.map((r) => ({ ...r, fit: "exact" })), ...data.same_sku.map((r) => ({ ...r, fit: "sku" }))];
        state.all = false;
        $("pickTitle").textContent = state.list.length
          ? `${sku} · ${size}: which return is this?`
          : `No return expected for ${sku} · ${size}`;
        $("pickSearch").hidden = true;
        drawPick(data.others);
        show("pickCard");
      } catch (err) {
        message("error", esc(err.message));
      }
    }

    $("showAll").addEventListener("click", async () => {
      message("", "");
      try {
        const data = await post("/api/returns/open", {});
        state.list = (data.returns || []).filter((r) => ["to_decide", "expected", "received"].includes(r.status)).map((r) => ({ ...r, fit: "" }));
        state.all = true;
        $("pickTitle").textContent = `${state.list.length} expected return${state.list.length === 1 ? "" : "s"}`;
        $("pickSearch").hidden = false;
        $("pickSearch").value = "";
        drawPick(0);
        show("pickCard");
        $("pickSearch").focus();
      } catch (err) {
        message("error", esc(err.message));
      }
    });

    $("pickSearch").addEventListener("input", () => drawPick(0));

    function drawPick(others) {
      const term = $("pickSearch").hidden ? "" : $("pickSearch").value.trim().toLowerCase();
      const list = state.list.filter((r) => !term || [r.order_id, r.shopify_order_number, r.marketplace_order_id, r.item_id, r.sku, r.size, r.seller_id, r.seller_name, r.store_name, r.tracking_code, `ret-${r.return_number}`].join(" ").toLowerCase().includes(term));

      $("pickList").innerHTML = `<div class="list">${list.map((r) => `
        <button class="item" type="button" data-id="${esc(r.id)}">
          ${r.image_url ? `<img src="${esc(r.image_url)}" alt="" onerror="this.style.visibility='hidden'">` : '<span class="noimg"></span>'}
          <span>
            <strong>${esc(r.sku)} · ${esc(r.size)}</strong>${r.fit === "sku" ? '<span class="tag warn">other size</span>' : ""}${r.status === "to_decide" ? '<span class="tag warn">cancelled before shipping?</span>' : ""}<br>
            ${r.shopify_order_number ? `<span style="color:var(--text)">Order ${esc(r.shopify_order_number)}</span><br>` : ""}
            <span class="muted">${esc(r.product_name || "")}</span><br>
            <span class="muted">RET-${esc(r.return_number)} · ${esc(SOURCE[r.source] || r.source)} · ${esc(r.order_id || "")}${r.item_id ? ` · ${esc(r.item_id)}` : ""}${r.seller_id ? ` · ${esc(r.seller_id)}` : ""}</span>
            ${r.reason ? `<br><span class="muted">Reason: ${esc(r.reason)}</span>` : ""}
          </span>
          <span class="muted">${esc(day(r.created_at))}</span>
        </button>`).join("")}</div>
        ${!list.length ? '<p class="muted">Nothing matches. Check the box, or use "Show all expected returns". A pair that was never announced has to be cancelled in the admin first (Cancel order on its order).</p>' : ""}
        ${others && !state.all ? `<p class="muted">${others} other return${others === 1 ? " is" : "s are"} expected; "Show all expected returns" lists them.</p>` : ""}`;
    }

    $("pickList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      state.chosen = state.list.find((r) => r.id === button.dataset.id);
      drawJudge();
    });

    /* ---------------- OK or flaw ---------------- */

    // Whose pair it is, as the admin decides it (admin/returns.js ownerOf).
    const ownerOf = (r) => r.unit_type === "Partner Consignment" ? "partner"
      : (["Consignment", "Direct"].includes(r.unit_type) || /^(CS|OUT)-/.test(r.item_id || "")) && r.seller_id ? "seller" : "own";

    function drawJudge() {
      const r = state.chosen;
      $("judgeTitle").textContent = `RET-${r.return_number} · ${r.sku} · ${r.size}`;
      $("judgeInfo").innerHTML = `
        ${r.image_url ? `<img src="${esc(r.image_url)}" alt="" onerror="this.style.visibility='hidden'" style="width:120px;height:120px;object-fit:contain;background:#fff;border-radius:12px;float:right;margin-left:12px">` : ""}
        <p style="margin:0 0 6px"><strong style="color:var(--text)">${esc(r.product_name || "")}</strong></p>
        ${r.shopify_order_number ? `<p style="margin:0 0 6px;font-size:18px;color:var(--text)">Order <strong>${esc(r.shopify_order_number)}</strong></p>` : ""}
        <p style="margin:0 0 6px">${esc(SOURCE[r.source] || r.source)} · ${esc(r.order_id || "")}${r.store_name ? ` · ${esc(r.store_name)}` : ""}</p>
        <p style="margin:0 0 6px">Unit ${esc(r.item_id || "—")}${r.seller_id ? ` · ${esc(r.seller_id)} ${esc(r.seller_name || "")}` : ""}</p>
        ${r.reason ? `<p style="margin:0 0 6px">Reason: ${esc(r.reason)}${r.customer_comment ? ` - "${esc(r.customer_comment)}"` : ""}</p>` : ""}
        ${state.sku && (state.sku !== String(r.sku || "").toUpperCase() || state.size !== String(r.size || "")) ? `<p style="margin:0;color:var(--warn)">The box says ${esc(state.sku)} · ${esc(state.size)}. Check it is the right pair.</p>` : ""}
        <div style="clear:both"></div>`;
      $("flawBox").hidden = true;
      $("flawNote").value = "";
      // A seller's or partner's pair gets a second question; ours does not.
      const owner = ownerOf(r);
      $("okThenBox").hidden = owner !== "seller";
      $("flawThenBox").hidden = owner === "own";
      $("okThen").value = "keep";
      $("flawThen").value = "send_back";
      show("judgeCard");
    }

    $("back").addEventListener("click", () => show(state.list.length || state.all ? "pickCard" : ""));
    $("flawButton").addEventListener("click", () => { $("flawBox").hidden = false; $("flawNote").focus(); });

    async function receive(verdict) {
      const r = state.chosen;
      const note = $("flawNote").value.trim();
      if (verdict === "flaw" && !note) return message("error", "Describe the flaw first.");

      for (const id of ["okButton", "flawButton", "flawSave"]) $(id).disabled = true;
      try {
        const data = await post("/api/returns/receive", {
          id: r.id,
          verdict,
          then: verdict === "ok" ? ($("okThenBox").hidden ? "" : $("okThen").value) : ($("flawThenBox").hidden ? "" : $("flawThen").value),
          note,
          // Learned only when it was typed in by hand.
          barcode: state.learn ? state.barcode : ""
        });
        const done = data.return || {};
        const todos = (done.todo || []).filter((t) => !t.done);
        message("success", `<strong>RET-${esc(done.return_number)} done:</strong> ${esc(done.result || "")}${todos.length ? `<ul>${todos.map((t) => `<li>${esc(t.text)}</li>`).join("")}</ul><span>These are on the Returns tab in the admin.</span>` : ""}`);
        reset();
      } catch (err) {
        message("error", esc(err.message));
      } finally {
        for (const id of ["okButton", "flawButton", "flawSave"]) $(id).disabled = false;
      }
    }

    $("okButton").addEventListener("click", () => receive("ok"));
    $("flawSave").addEventListener("click", () => receive("flaw"));
  </script>
</body>
</html>
